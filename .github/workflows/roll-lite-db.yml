name: roll-lite-db

# 경량 DB를 매일 갱신 → GitHub Release 자산 교체 → Render 재배포 훅 호출 → Discord 알림.
# 최초 1회는 로컬에서 `python deploy/build_lite_db.py` 실행 후 Release( tag: lite-db )에
# app_lite.db 를 업로드해 두어야 한다.
#
# CI는 KRX 로그인·네이버 스크래핑이 막혀 있으므로 `roll_lite_db.py`가 `stage=ohlcv-only`로만 수집한다
# (지수 FDR + 타깃 OHLCV FDR, 수급 컬럼 NULL). 수집이 실패하거나 새 거래일이 없으면 스크립트가
# 비정상 종료하고, 이후 Release 업로드·재배포는 건너뛰며 Discord로 경고를 보낸다.

on:
  schedule:
    - cron: "30 9 * * 1-5"      # 평일 09:30 UTC (KST 18:30)
  workflow_dispatch: {}

permissions:
  contents: write                # Release 자산 갱신용

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Download current lite DB from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download lite-db --pattern app_lite.db --dir data --clobber \
            || echo "기존 Release 자산 없음 — build 로 생성"

      - name: Build lite DB if missing
        run: |
          if [ ! -f data/app_lite.db ]; then
            echo "전체 app.db 가 없으면 이 단계는 실패한다(최초 1회는 로컬 build 후 수동 업로드 필요)."
            python deploy/build_lite_db.py
          fi

      - name: Roll (ohlcv-only incremental collect + prune)
        # FDR 지수 + 타깃 OHLCV만 증분 수집(수급 NULL) 후 730일 밖 프루닝/VACUUM.
        # 수집 실패·신규 거래일 없음이면 스크립트가 exit 1 → 이후 스텝 건너뜀 + 아래 실패 알림.
        run: python deploy/roll_lite_db.py

      - name: Upload lite DB to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lite-db >/dev/null 2>&1 || gh release create lite-db --notes "rolling lite db"
          gh release upload lite-db data/app_lite.db --clobber

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsSL -X POST "$HOOK"; else echo "RENDER_DEPLOY_HOOK_URL 미설정 — 건너뜀"; fi

      - name: Discord notify (failure warning)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -fsSL -H "Content-Type: application/json" -X POST \
              -d "{\"content\":\"⚠️ roll-lite-db 실패 ($(date -u +%FT%TZ)) — ohlcv-only 수집 실패/신규 거래일 없음. 기존 Release 자산 보존, 재배포 건너뜀. 수동 조치 필요(Actions 재실행 또는 로컬 build_lite_db.py 후 Release 교체).\"}" "$WEBHOOK"
          fi

      - name: Discord notify (result)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -fsSL -H "Content-Type: application/json" -X POST \
              -d "{\"content\":\"roll-lite-db: ${{ job.status }} ($(date -u +%FT%TZ))\"}" "$WEBHOOK"
          fi

name: roll-lite-db

# 경량 DB 갱신 → GitHub Release 자산 교체 → Render 재배포 훅 호출 → Discord 커버리지 리포트.
# 최초 1회는 로컬에서 `python deploy/build_lite_db.py` 실행 후 Release( tag: lite-db )에
# app_lite.db 를 업로드해 두어야 한다.
#
# 트리거: schedule 크론은 GitHub 부하 시간대에서 4~8시간씩 지연돼 제거했다. 이제 이 워크플로는
# (1) Render 웹앱이 평일 KST 17시 이후 UptimeRobot 핑을 계기로 REST API(workflow_dispatch)로
#     원격 발동하거나, (2) 사람이 수동 실행할 때만 돈다.
#
# CI는 KRX 로그인·네이버 스크래핑이 막혀 있으므로 `roll_lite_db.py`가 `stage=ohlcv-only`로만 수집한다
# (지수 FDR + 타깃 OHLCV FDR, 수급 컬럼 NULL). 수집 실패·신규 거래일 없음이면 스크립트가 exit 1 →
# 이후 Release 업로드·재배포는 건너뛴다. 마지막 커버리지 리포트 스텝은 항상 실행돼
# "오늘(KST) 수집 종목 수 / 전체" 를 Discord 로 보고한다(휴장이면 0/N).

on:
  workflow_dispatch: {}

permissions:
  contents: write                # Release 자산 갱신용

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 30            # job 바깥 상한 (기본 360분 → 30분)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Download current lite DB from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download lite-db --pattern app_lite.db --dir data --clobber \
            || echo "기존 Release 자산 없음 — build 로 생성"

      - name: Build lite DB if missing
        run: |
          if [ ! -f data/app_lite.db ]; then
            echo "전체 app.db 가 없으면 이 단계는 실패한다(최초 1회는 로컬 build 후 수동 업로드 필요)."
            python deploy/build_lite_db.py
          fi

      - name: Roll (ohlcv-only incremental collect + prune)
        # FDR 지수 + 타깃 OHLCV만 증분 수집(수급 NULL) 후 730일 밖 프루닝/VACUUM.
        # 수집 실패·신규 거래일 없음이면 스크립트가 exit 1 → 이후 Release 업로드·재배포 스텝 건너뜀.
        # 스텝 타임아웃 20분: FDR 정체로 멈춰도 여기서 끊고, 아래 커버리지 리포트(if: always())는 실행된다.
        timeout-minutes: 20
        run: python deploy/roll_lite_db.py

      - name: Upload lite DB to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lite-db >/dev/null 2>&1 || gh release create lite-db --notes "rolling lite db"
          gh release upload lite-db data/app_lite.db --clobber

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsSL -X POST "$HOOK"; else echo "RENDER_DEPLOY_HOOK_URL 미설정 — 건너뜀"; fi

      - name: Discord coverage report
        # 성공·중단·부분실패 무관하게 항상 실행. 갱신된 app_lite.db 에서 오늘(KST) 날짜에
        # 데이터가 들어온 타깃 종목 수 / 전체를 계산해 Discord 로 보고한다(휴장이면 0/N).
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python deploy/report_coverage.py
